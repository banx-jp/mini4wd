<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini 4wd site</title>

  <!-- 提示されたCSSを読み込み -->
  <link rel="stylesheet" href="style.css">

  <!-- MarkdownをHTMLに変換するライブラリ (marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- トップへ戻るボタン -->
  <div style="margin-bottom: 20px;">
    <a href="#">← トップページへ</a>
  </div>

  <!-- Markdownの内容がここに描画されます -->
  <main id="content"></main>

  <script>
    function loadPage() {
      // URLの # の後ろを取得（指定がなければ README.md）
      let file = location.hash.replace(/^#/, '');
      if (!file) file = 'README.md';

      // キャッシュを回避して最新のMarkdownを取得
      fetch(file + '?t=' + new Date().getTime())
        .then(response => {
          if (!response.ok) {
            throw new Error('ファイルが見つかりませんでした: ' + file);
          }
          return response.text();
        })
        .then(markdown => {
          document.getElementById('content').innerHTML = marked.parse(markdown);
          window.scrollTo(0, 0); // ページの先頭にスクロール
        })
        .catch(error => {
          document.getElementById('content').innerHTML = 
            '<p style="color:#f472b6;">エラー: ' + error.message + '</p>';
        });
    }

    // 初回読み込み時およびURLの # が変わった時に実行
    loadPage();
    window.addEventListener('hashchange', loadPage);
  </script>

</body>
</html>
